<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                width: 150px;
                height: 150px;
                background-color: red;
                border: 1px solid black;
                transform: translate(50px, 100px);
            }
            div2{
                transform: rotate(20deg);
            }
        </style>
    </head>
    <body>
        <div>hi this is a div and its using the traslate feature</div>
        <div2>hi this is a div and its using the rotate feature</div2>
    </body>
</html>
