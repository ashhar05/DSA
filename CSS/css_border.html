<!DOCTYPE html>
<html>
    <head>
        <style>
            p.one{
                border-style: solid;
                border-width: 5px;
            }
            p.two{
                border-style: solid;
                border-width: medium;
            }
            p.three{
                border-style: dotted;
                border-width: medium;
            }
        </style>

    </head>
    <body>
        <p class="one">This is a paragraph with a solid border.</p>
        <p class="two">This is a paragraph with a solid border of medium width.</p>
        <p class="three">This is a paragraph with a dotted border of medium width.</p>
    </body>
</html>
