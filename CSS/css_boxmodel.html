<!DOCTYPE html>
<html>
<head>
    <title>CSS Border</title>
    <style>
        p {
            border: 2px solid black;
            outline: #000 solid 10px;
            text-align: center;
            padding: 20px;
            margin: auto;
        }
    </style> 
    <body>
        <p>This is a paragraph with a solid border and an outline.</p>
    </body>
</html>
