<!DOCTYPE html>
<html>
    <head>
        <style>
            p.uppercase{
                text-transform: uppercase;
            }
            p.lowercase{
                text-transform: lowercase;
            }
            p.capitalize{
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
        <p class="uppercase">This is a paragraph with uppercase text transformation.</p>
        <p class="lowercase">This is a paragraph with lowercase text transformation.</p>
        <p class="capitalize">this is a paragraph with capitalize text transformation.</p>
    </body>
</html>
