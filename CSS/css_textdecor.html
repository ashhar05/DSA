<!DOCTYPE html>
<html>
<head>
    <style>
       h1 {
            text-decoration: underline;
        }
        h2 {
            text-decoration: overline;
        }
        h3 {
            text-decoration: overline underline;
            text-decoration-color: red;
        }
    </style>
</head>
<body>
    <h1>This is a heading with underline text decoration.</h1>
    <h2>This is a heading with overline text decoration.</h2>
    <h3>This is a heading with both overline and underline text decoration.</h3>
</body>
</html>
