
<!DOCTYPE html>
<html>
<head>
    <title>Button Hover Effects</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            border: none;
            cursor: pointer;
            transition: 0.5s;
        }

        /* Button 1: Rotate 360 degrees */
        .btn1 {
            background: blue;
            color: white;
        }
        .btn1:hover {
            transform: rotate(720deg);
        }

        /* Button 2: Change background color */
        .btn2 {
            background: green;
            color: white;
        }
        .btn2:hover {
            background: orange;
        }

        /* Button 3: Change background and text */
        .btn3 {
            background: purple;
            color: rgb(211, 13, 13);
        }
        .btn3:hover {
            background: yellow;
            color: black;
        }

        /* Button 4: Become invisible */
        .btn4 {
            background: red;
            color: white;
        }
        .btn4:hover {
            opacity: 0;
        }
    </style>
</head>
<body>

    <h2>Button Hover Effects</h2>

    <button class="btn1">Button 1</button>
    <button class="btn2">Button 2</button>
    <button class="btn3">Button 3</button>
    <button class="btn4">Button 4</button>

</body>
</html>
