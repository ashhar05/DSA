<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .box {
            border: 2px solid black;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .main-container {
            max-width: 1200px;
            margin-top: 30px;
        }

        .row {
            --bs-gutter-x: 0;
        }
    </style>
</head>

<body>

<div class="container main-container">

    <!-- Box 1 -->
    <div class="row">
        <div class="col-12">
            <div class="box" style="height: 155px;">
                PSIT KANPUR
            </div>
        </div>
    </div>

    <!-- Box 2 and Box 3 -->
    <div class="row">
        <div class="col-6">
            <div class="box" style="height: 155px;">
                Subject Code: FSD 301
            </div>
        </div>

        <div class="col-6">
            <div class="box" style="height: 155px;">
                Branch: CSE
            </div>
        </div>
    </div>

    <!-- Box 4 -->
    <div class="row">
        <div class="col-12">
            <div class="box" style="height: 155px;">
                Name: Ashhar Raheem
            </div>
        </div>
    </div>

    <!-- Box 5 and Box 6 -->
    <div class="row">
        <div class="col-6">
            <div class="box" style="height: 155px;">
                Section: II A
            </div>
        </div>

        <div class="col-6">
            <div class="box" style="height: 155px;">
                City: KANPUR    
            </div>
        </div>
    </div>

</div>

</body>
</html>
