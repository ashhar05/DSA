<!DOCTYPE html>
<html>
<body>

    <h1>Password Field</h1>
    <input type="password" id="box">
    <button onclick="show()">Show</button>

    <script>
        function show()
        {
            let x = document.getElementById("box");

            if(x.type == "password")
                x.type = "text";
            else
                x.type = "password";
        }
    </script>

</body>
</html>
