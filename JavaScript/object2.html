<!DOCTYPE html>
<html>
    <body>
        <h2> javascript html dom</h2>
        <p id="intro">finding html elements by id</p>
        <p id="demo">The text in the intro paragraph will be changed.</p>
        <script>
            const person = {
                firstName: "John",
                lastName: "Doe",
                age: 30,
                eyeColor: "blue"
            };
            document.getElementById("demo").innerHTML = "the text from the intro paragraph is: " + person.firstName + " " + person.lastName ;
        </script>
    </body>
</html>
