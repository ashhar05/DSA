<!DOCTYPE html>
<html>
    <body>
        <h2> using an object literal</h2>
        <p id="demo"></p>
        <script>
            // create an object
            const person = {
                firstName: "John",
                lastName: "Doe",
                age: 30,
                eyeColor: "blue"
            };
            // display the value of the object
            document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old.";
        </script>
    </body>
</html>
